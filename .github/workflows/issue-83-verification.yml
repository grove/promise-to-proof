name: Issue 83 verification (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Single-request entry regressions
        run: python3 -m unittest discover -s checks -p 'test_p2p_single_entry.py' -v
      - name: Full deterministic regression suite
        run: |
          git fetch --no-tags origin cc27a47f5ee765cff3cf13b21c36f974cb1234ae eb84d66dd70ce8998cd43e951741785e8520c301
          python3 -m unittest discover -s checks -p 'test_*.py'
