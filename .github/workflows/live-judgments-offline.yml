name: Live judgments runner (offline regressions)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fixture-runner:
    name: Offline fixture and runner checks (not live evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Some historical deterministic fixtures need exact past commits.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fixture manifest, offline oracle, and failure behavior
        run: python3 -m unittest discover -s checks -p 'test_live_judgments.py' -v
      - name: Verify exact coverage and review-scope regressions
        run: python3 -m unittest discover -s checks -p 'test_p2p_coverage.py' -v
      - name: Verify risk-to-check traces and exact target intersections
        run: python3 -m unittest discover -s checks -p 'test_p2p_risks.py' -v
      - name: Check integrated contract quality, stage bindings, and stopping (offline only)
        run: python3 -m unittest discover -s checks -p 'test_p2p_quality_integration.py' -v
      - name: Verify first-pass capture and source identity fast paths
        run: python3 -m unittest discover -s checks -p 'test_p2p_first_pass.py' -v
      - name: Compare same-assurance first-pass baseline and optimized controller
        run: python3 checks/benchmark_p2p_first_pass.py --repeats 1
      - name: Verify unchanged and selective incremental delivery reuse
        run: python3 -m unittest discover -s checks -p 'test_p2p_applicability.py' -v
      - name: Measure cold, unchanged, restored and delta continuation (offline only)
        run: python3 checks/benchmark_p2p_incremental.py --repeats 2
      - name: Guard pinned instructions and same-version restored continuation
        run: >-
          python3 -m unittest discover -s checks -p 'test_p2p_instruction_upgrades.py'
          -k 'test_pinned_resume_ignores_changed_installation_without_repeating_completed_work'
          -k 'test_portable_restore_retains_pinned_instructions_and_completed_review'
          -k 'test_upgrade_preserves_work_refreshes_only_verifiers_and_is_idempotent'
      - name: Check existing generation and repair behavior
        run: >-
          python3 -m unittest discover -s checks -p 'test_p2p_delivery.py'
          -k 'test_local_git_generations_reconstruct_reuse_objects_and_bind_reports'
          -k 'test_successful_repair_rereviews_and_reproves'
      - name: Check candidate scope and compact terminal records
        run: >-
          python3 -m unittest discover -s checks -p 'test_p2p_delivery.py'
          -k 'test_footprint_metrics_p2p_self_delivery'
          -k 'test_footprint_metrics_large_synthetic_repository'
          -k 'test_success_prunes_execution_state_but_retains_candidate_workspace'
          -k 'test_stale_and_missing_coverage_rejected'
      - name: Check retained verification history
        run: python3 -m unittest discover -s checks -p 'test_p2p_verification_history.py'
      - name: Check review's pragmatic test-quality instructions
        run: python3 -m unittest discover -s checks -p 'test_pragmatic_verification.py'
