name: Complete offline regression suite
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-offline-suite:
    name: Complete offline unittest suite (not live evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python and pinned historical Git revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          for revision in cc27a47f5ee765cff3cf13b21c36f974cb1234ae eb84d66dd70ce8998cd43e951741785e8520c301; do
            if ! git cat-file -e "$revision^{commit}"; then
              git fetch --no-tags origin "$revision"
            fi
            git cat-file -e "$revision^{commit}" || { echo "::error::Missing historical revision: $revision"; exit 1; }
          done
      - name: Discover, run, and report complete offline regression suite
        run: python3 checks/run_offline_suite.py
