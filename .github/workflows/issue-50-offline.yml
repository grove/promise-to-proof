name: Issue 50 delivery record verification (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch exact pinned historical controller and agreement
        run: git fetch --no-tags origin cc27a47f5ee765cff3cf13b21c36f974cb1234ae eb84d66dd70ce8998cd43e951741785e8520c301
      - name: Delivery Record v1 focused regression suite
        run: python3 -m unittest discover -s checks -p 'test_p2p_delivery_record.py' -v
      - name: Previously failing coverage-fixture routing regressions
        run: |
          cd checks
          python3 -m unittest \
            test_p2p_delivery.DeliveryTests.test_child_routing_resolves_approved_remote_tracking_destination \
            test_p2p_delivery.DeliveryTests.test_child_routing_transfers_plan_and_binds_stage_inputs \
            test_p2p_delivery.DeliveryTests.test_child_stale_admission_blocks_but_target_advance_after_admission_is_observational \
            test_p2p_delivery.DeliveryTests.test_child_starting_tree_is_target_not_unrelated_head \
            test_p2p_delivery.DeliveryTests.test_footprint_metrics_p2p_self_delivery \
            test_p2p_delivery.DeliveryTests.test_legacy_approved_route_resumes_after_target_move_when_base_is_recoverable \
            test_p2p_delivery.DeliveryTests.test_parent_uses_final_destination_and_plan_loss_blocks_resume
      - name: Historical copied-controller compatibility
        run: |
          cd checks
          python3 -m unittest test_run_delivery_comparison.PilotTests.test_copied_controllers_repair_order_and_exhaustion -v
      - name: Repository deterministic regressions
        run: |
          python3 -m unittest discover -s checks -p 'test_*.py'
